; PlatformIO Project Configuration File
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Shared settings inherited by all environments
[env]
platform = atmelsam
board = adafruit_feather_m4_can
framework = arduino
lib_deps = lib/Adafruit_CAN
monitor_speed = 115200

; MK60 -> Haltech CAN translator (production firmware)
; Build/upload with: pio run -e adafruit_feather_m4_can -t upload
[env:adafruit_feather_m4_can]
build_src_filter = +<main.cpp>

; Flash this environment to test BRZ wheel speed input to the Haltech.
; Build/upload with: pio run -e brz_wheel_sweep_test -t upload
[env:brz_wheel_sweep_test]
build_src_filter = +<brz_wheel_sweep_test.cpp>

; Flash this environment to test BRZ steering angle input to the Haltech.
; Build/upload with: pio run -e brz_steering_test -t upload
[env:brz_steering_test]
build_src_filter = +<brz_steering_test.cpp>

; Flash this environment to monitor raw MK60 LWS1 (0x1F5) steering angle bytes.
; Build/upload with: pio run -e lws1_monitor -t upload
[env:lws1_monitor]
build_src_filter = +<lws1_monitor.cpp>

; Flash this environment to test whether the MK60 validates the VIN in the
; 0x610 ICL1 handshake response. Cycles through different VIN payloads on
; successive RTRs and reports whether 0x1F0 wheel speeds are seen after each.
; Build/upload with: pio run -e vin_test -t upload
[env:vin_test]
build_src_filter = +<vin_test.cpp>

; Flash this environment to diagnose MK60 boot timing issues.
; Provides serial commands to manually trigger keepalive sequences:
;   r -- send 0x610 ICL1 burst on demand
;   s -- send sustained ICL2/ICL3/DME1/DME2 keepalives for 10 s
; Build/upload with: pio run -e keepalive_test -t upload
[env:keepalive_test]
build_src_filter = +<keepalive_test.cpp>
